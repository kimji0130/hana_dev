  <script>
    $(document).ready(function(){
      $(window).on("load", function(){
        var lists = $('a.agree_txt').lenth //class 갯수
        var listsTop = $('.agreeTop').lenth //class 갯수
        var sum = 0; // 높이 값 합계 변수
        var total = [0]; //배율로 합계 정렬 0은 첫번째 높이
        for(var i = 0; i < listsTop; i++){
          var tops = $('.agreeTop').eq(i).outerHeight(); // .agreeTop 높이 값
          sum = sum + tops; // past agreeTop + present agreeTop
          total.push(sum); // 배열 추가
        }

        var noActionMarkeing = $('#optAgreeAll').next('.content_box_group').find('.agree_txt'); // 마케팅 종의 영역 셀렉터
        $('a.agrr_txt').not(noActionMarketing).click(function(e){
          var agreeNum = $('a.agree_txt').index(this) //클릭한 인덱스 값
          $('.agree.sec01').scrollTop(total[agreeNum]);
          return false;
        });
      });
    });
  </script>
